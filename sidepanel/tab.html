<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS HTML — Aba de Teste</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="tab.css">
</head>
<body>
  <div class="scanlines"></div>

  <div class="terminal-window">
    <div class="title-bar">
      <div class="traffic-lights">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="path-label">~/yks-html/index.html — fullscreen</div>
    </div>

    <div class="command-line">
      <span class="prompt">$</span>
      <span class="command-text" id="commandText">preview --fullscreen</span>
      <span class="cursor blink">█</span>
    </div>

    <div class="tab-pane editor-pane">
      <div class="panel-header">
        <span class="panel-label">[FONTE]</span>
      </div>
      <div class="editor-wrapper">
        <textarea
          id="fonte"
          name="fonte"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          placeholder="$ digite ou cole seu HTML aqui..."
        ><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Página</title>
</head>
<body>
  <h1>Olá, Mundo!</h1>
  <p>Preview destrutivo via document.write().</p>
  <script>
    console.log('Executando no contexto da página de teste.');
  </script>
</body>
</html></textarea>
      </div>
    </div>

    <div class="view-actions">
      <button class="view-btn" id="btnTestar" value="Testar sua página" onclick="document.write(fonte.value)">Testar sua página</button>
    </div>

    <div class="toolbar">
      <button class="tool-btn" id="btnClose" title="Fechar aba de teste">[ Fechar ]</button>
    </div>

    <div class="footer">
      <span class="footer-text">$ git status — yks-html v1.0.0 — fullscreen preview</span>
    </div>
  </div>

  <script>window.fonte = document.getElementById('fonte');</script>
  <script src="tab.js"></script>
</body>
</html>
